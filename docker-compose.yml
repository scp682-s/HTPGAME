version: '3.8'

services:
  htpgame:
    build: .
    container_name: htpgame
    restart: always
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - BAILIAN_API_KEY=${BAILIAN_API_KEY}
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    networks:
      - htpgame-network

networks:
  htpgame-network:
    driver: bridge
